name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Branch protection requires this job by name. Update it there if you rename it.
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fooddate
          POSTGRES_USER: fooddate
          POSTGRES_PASSWORD: ci-only
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fooddate"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --fail-level WARNING
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
