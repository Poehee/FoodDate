{% load static %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#172027" media="(prefers-color-scheme: dark)">
  <title>{% block title %}FoodDate{% endblock %}</title>
  <link rel="icon" href="{% static 'inventory/icon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'inventory/app.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{% url 'inventory:home' %}">
        <img src="{% static 'inventory/icon.svg' %}" width="28" height="28" alt="">
        FoodDate
      </a>
    </div>
  </header>
  <main id="main" class="container page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
